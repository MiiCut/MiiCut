<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
    <!-- Extension lines (vertical) -->
    <line x1="6" y1="20" x2="6" y2="8" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="26" y1="20" x2="26" y2="8" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Dimension line (horizontal) -->
    <line x1="6" y1="12" x2="26" y2="12" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Left arrowhead -->
    <line x1="6" y1="12" x2="11" y2="9" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="12" x2="11" y2="15" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Right arrowhead -->
    <line x1="26" y1="12" x2="21" y2="9" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="26" y1="12" x2="21" y2="15" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Dimension text indicator -->
    <text x="16" y="28" text-anchor="middle" font-family="sans-serif" font-size="9" fill="black">L</text>
</svg>
