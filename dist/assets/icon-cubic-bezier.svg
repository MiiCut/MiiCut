<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
    <!-- Control line 1 -->
    <line x1="8" y1="16" x2="10" y2="28" stroke="gray" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- Control line 2 -->
    <line x1="24" y1="8" x2="28" y2="24" stroke="gray" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- Bézier curve -->
    <path d="M 8 16 C 10 32, 30 24, 24 8" fill="none" stroke="black" stroke-width="2"/>
    <!-- Start point -->
    <circle cx="8" cy="16" r="1.5" fill="black"/>
    <!-- End point -->
    <circle cx="24" cy="8" r="1.5" fill="black"/>
    <!-- Control point 1 -->
    <circle cx="10" cy="28" r="2" fill="red"/>
    <!-- Control point 2 -->
    <circle cx="28" cy="24" r="2" fill="red"/>
</svg>
