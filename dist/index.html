<!DOCTYPE html><html lang="en"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MiiCut</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron&amp;display=swap">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono&amp;display=swap" rel="stylesheet">

<body> 
    <input type="file" id="file-input" style="display: none;">

    <div class="left-panel" id="left-panel">
        <!-- Tools go here -->
        <div class="icon-container">
            <div id="icon-arrow" class="icon icon-selected" data-tooltip="Select element, move the canvas"></div>
            <div id="icon-selection" class="icon" data-tooltip="Select multiple elements inside the area"></div>
            <div id="icon-scissors" class="icon" data-tooltip="Cut until intersection"></div>
            <div class="icon-separator"></div>
            <div id="icon-rectangle" class="icon" data-tooltip="Draw a rectangle"></div>
            <div id="icon-rectangle-rounded" class="icon" data-tooltip="Draw a rounded corners rectangle"></div>
            <div id="icon-circle" class="icon" data-tooltip="Draw a circle"></div>
            <div id="icon-oblong" class="icon" data-tooltip="Draw an oblong circle"></div>
        </div>
    </div>

    <div id="settingsPanel">
        <form id="worksheetSettings">
            <label>Work sheet Width: 
                <input type="number" id="worksheetWidthInput">
            </label>
            <br>
            <label>Work sheet Height: 
                <input type="number" id="worksheetHeightInput">
            </label>
            <br>
            <button type="button" id="applyWorksheetSettings">Apply</button>
        </form>
    </div>
    <div id="modalBackdrop"></div>
    <div id="top-menu" class="top-menu">
        <div id="menuTitle">
            &nbsp;MiiCut (wip)
        </div>
        
        <!-- Create a dropdown menu with File as the heading and Load and Save as options -->
        <div class="dropdown">
            <button class="dropbtn">File</button>
            <div class="dropdown-content">
                <a href="#" id="load-option">Load SVG path</a>
                <a href="#" id="save-option">Save drawing (TBD)</a>
            </div>
        </div>
        
        <!-- The other parts of your top menu, if any, go here -->
        <div>
            <!-- Placeholder for other menu items or elements -->
        </div>
    </div>
    <div id="canvas-container">
        <canvas id="myCanvas" tabindex="0"></canvas>
        <div id="cm-shape" class="context-menu">
            <div class="separator"></div>
            <a href="#" id="cm-shape-force-horizontal">Keep horizontal</a>
            <a href="#" id="cm-shape-force-vertical">Keep vertical</a>
            <a href="#" id="cm-shape-unforce-horizontal">Cancel keep horizontal</a>
            <a href="#" id="cm-shape-unforce-vertical">Cancel keep vertical</a>
            <div class="separator"></div>
        </div>
    </div>
    <div id="status-bar" class="status-bar">
        <div class="status-section" id="status-viewgrid">Grid size: NA</div>
        <div class="status-section" id="status-snapgrid">Snap grip: NA</div>
        <div class="status-section" id="status-info-worksheet-pos"></div>
        <div class="status-section" id="status-buttons">
            <button>Button 1</button>
            <button>Button 2</button>
        </div>
        <!-- Add more sections as needed -->
    </div>
    <div id="tooltip" class="tooltip"></div>
