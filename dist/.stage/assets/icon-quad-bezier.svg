<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
    <!-- Control line -->
    <line x1="8" y1="16" x2="16" y2="28" stroke="gray" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- Bézier curve -->
    <path d="M 8 16 Q 20 32, 24 8" fill="none" stroke="black" stroke-width="2"/>
    <!-- Start point -->
    <circle cx="8" cy="16" r="1.5" fill="black"/>
    <!-- End point -->
    <circle cx="24" cy="8" r="1.5" fill="black"/>
    <!-- Control point -->
    <circle cx="16" cy="28" r="2" fill="red"/>
</svg>
